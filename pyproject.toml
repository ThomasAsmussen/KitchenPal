[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenpal"
version = "0.1.0"
description = "KitchenPal Streamlit app with Google Sheets backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "gspread",
    "oauth2client",
    "pandas",
    "ortools",
]

[project.optional-dependencies]
test = [
    "openpyxl>=3.1",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# The identity component is a static HTML file that Streamlit serves; a wheel
# that dropped it would deploy an app that cannot remember who you are.
[tool.setuptools.package-data]
"kitchenpal.ui" = ["identity_component/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
